<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CosmoCraft</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: monospace; }
    canvas { display: block; }
    #hud { position: fixed; inset: 0; pointer-events: none; }
    #overlay {
      position: fixed; inset: 0; display: flex;
      align-items: center; justify-content: center;
      background: rgba(0,0,20,0.85); color: #7af; font-size: 24px;
      cursor: pointer; z-index: 10;
    }
    #overlay.hidden { display: none; }
    #travel-ui.hidden { display: none; }
  </style>
</head>
<body>
  <div id="overlay">
    <div style="text-align:center">
      <div style="font-size:48px;margin-bottom:16px">🚀 CosmoCraft</div>
      <div style="margin-bottom:20px;">
        <button id="btn-survival" style="padding:10px 20px; font-size:18px; margin:5px; cursor:pointer; background:#28f; color:#fff; border:none; border-radius:4px;">Supervivencia</button>
        <button id="btn-creative" style="padding:10px 20px; font-size:18px; margin:5px; cursor:pointer; background:#f82; color:#fff; border:none; border-radius:4px;">Creativo</button>
        <button id="btn-inspector" style="padding:10px 20px; font-size:18px; margin:5px; cursor:pointer; background:#282; color:#fff; border:none; border-radius:4px;">Inspector</button>
      </div>
      <div id="overlay-hint" style="color:#aaa;">Selecciona un modo para empezar</div>
      <div style="font-size:14px;margin-top:12px;color:#5af">
        WASD mover · Espacio saltar · Click izq minar · Click der colocar · Rueda cambiar bloque
      </div>
      <div style="font-size:12px;margin-top:16px;color:#48f">
        ESC = pausar · el cursor se bloquea al jugar
      </div>
    </div>
  </div>
  
  <div id="travel-ui" class="hidden" style="position:fixed;inset:0;align-items:center;justify-content:center;background:rgba(0,0,20,0.9);color:#fff;z-index:20;display:flex;">
    <div style="text-align:center; padding: 20px; border: 2px solid #5af; background: #001; border-radius: 8px;">
      <h2 style="margin-bottom:20px; color:#5af;">Viaje Planetario</h2>
      <div id="planet-list" style="display:flex; flex-direction:column; gap:10px; margin-bottom:20px;">
      </div>
      <button id="btn-cancel-travel" style="padding:8px 16px; cursor:pointer; background:#555; color:#fff; border:none; border-radius:4px;">Cancelar</button>
    </div>
  </div>

  <div id="hud"></div>
  <div id="pause-menu" class="hidden" style="position:fixed;inset:0;align-items:center;justify-content:center;background:rgba(0,0,20,0.92);color:#fff;z-index:30;display:flex;"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
